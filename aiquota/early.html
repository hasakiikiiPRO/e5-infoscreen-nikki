<script>/* BEGIN e5-aiquota (the aiquota app, /etc/e5-infoscreen/plugins/aiquota) */
// The lock screen's second page: right shows the AI quotas over the clock, left
// goes back, up/down scroll; dark or unlocked, it is back to the clock.  Before
// power-menu.js and mobile.js: mobile.js takes every other key on the lock screen.
// Without the app (GET /quota 404) this does nothing.
(function () {
	const API = '/api/plugins/aiquota';
	let gone = false, panel = null, open = false, timer = null;
	// the panel's accounts -> rows; the WorkBuddy accounts (a pool of many) as one
	const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
	function left(ms) {
		let s = Math.max(0, Math.floor((ms - Date.now()) / 1000));
		const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
		return d ? `${d}天${h}时` : h ? `${h}时${m}分` : `${m}分`;
	}
	function bar(p, status) {
		const c = status == 'rate-limited' || p >= 90 ? '#ff6b6b' : p >= 60 || status == 'warn' ? '#f0b44c' : '#42d391';
		return `<i class="qb"><i style="width:${Math.min(100, Math.max(0, p))}%;background:${c}"></i></i>`;
	}
	function line(w) {
		const p = w.percent;
		return `<div class="ql"><span>${esc(w.label)}${w.tag ? ' ' + esc(w.tag) : ''}</span>${p != null ? `<b>${Math.round(p)}%</b>` : ''}</div>`
			+ (p != null ? bar(p, w.status) : '')
			+ (w.resets_at_ms ? `<div class="qr">${w.resets_at_ms > Date.now() ? `${esc(w.reset_label || '重置')} ${left(w.resets_at_ms)}后` : '已过重置时间（数据旧了）'}</div>` : '');
	}
	const STATE = { ok: ['正常', 'ok'], limited: ['用尽', 'bad'], error: ['异常', 'bad'] };
	function rows(accounts) {
		let html = '';
		const wb = accounts.filter((a) => a.source == 'workbuddy');
		for (const a of accounts.filter((a) => a.source != 'workbuddy')) {
			const st = STATE[a.state] ?? ['?', 'bad'];
			const ws = Object.values(a.windows ?? {}).filter((w) => w && typeof w == 'object');
			html += `<div class="qa"><div class="qn"><b>${esc(a.name)}</b><span class="${st[1]}">${st[0]}</span></div>`
				+ (ws.length ? ws.map(line).join('') : `<div class="qr">${esc(a.detail || '没有数据')}</div>`) + '</div>';
		}
		if (wb.length) {
			let remain = 0, size = 0, ok = 0, soon = null;
			for (const a of wb) {
				const m = /余\s*(\d+)\s*\/\s*(\d+)/.exec(a.windows?.credits?.label ?? '');
				if (m) { remain += +m[1]; size += +m[2]; }
				if (a.state == 'ok') ok++;
				const t = a.windows?.soonest?.resets_at_ms;
				if (t && (!soon || t < soon)) soon = t;
			}
			const p = size ? (size - remain) * 100 / size : null;
			html += `<div class="qa"><div class="qn"><b>workbuddy · ${wb.length} 个号</b><span class="${ok == wb.length ? 'ok' : 'bad'}">${ok}/${wb.length} 正常</span></div>`
				+ `<div class="ql"><span>积分 余 ${remain} / ${size}</span>${p != null ? `<b>${Math.round(p)}%</b>` : ''}</div>`
				+ (p != null ? bar(p, 'ok') : '') + (soon ? `<div class="qr">最早一批 ${left(soon)}后到期</div>` : '') + '</div>';
		}
		return html || '<div class="qr">没有账号</div>';
	}
	const QCSS = '.qa{background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;margin-bottom:7px}' +
		'.qn{display:flex;justify-content:space-between;gap:8px;font-size:13px}.qn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}' +
		'.qn .ok{color:#42d391;font-size:11px;flex-shrink:0}.qn .bad{color:#ff8a8a;font-size:11px;flex-shrink:0}' +
		'.ql{display:flex;justify-content:space-between;font-size:12px;color:#c6d0dc;margin-top:4px}.ql b{font-weight:600;color:#e8ecf2}' +
		'.qb{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:3px;overflow:hidden}.qb i{display:block;height:100%;border-radius:3px}' +
		'.qr{font-size:11px;color:#8997a8;margin-top:3px}';

	const lockShown = () => {
		const ls = document.getElementById('mobile-lockscreen');
		return !!ls && !ls.hidden && document.body.classList.contains('screen-locked') && !(typeof blank !== 'undefined' && blank);
	};
	function ensure() {
		if (panel?.isConnected) return panel;
		const ls = document.getElementById('mobile-lockscreen');
		if (!ls) return null;
		if (!document.getElementById('lock-quota-css')) {
			const css = document.createElement('style');
			css.id = 'lock-quota-css';
			css.textContent = '#lock-quota,#lock-quota *{box-sizing:border-box}#lock-quota{position:absolute;inset:0;z-index:5;background:rgba(8,13,20,.94);color:#e8ecf2;' +
				'padding:12px 12px 16px;overflow-y:auto;scrollbar-width:none;font:14px/1.45 "Noto Sans CJK SC",sans-serif}' +
				'#lock-quota h4{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between}#lock-quota h4 span{font-size:11px;color:#8997a8;font-weight:400}' + QCSS;
			document.head.appendChild(css);
		}
		panel = document.createElement('div');
		panel.id = 'lock-quota';
		panel.hidden = true;
		ls.appendChild(panel);
		return panel;
	}
	function render(d) {
		const p = ensure();
		if (!p) return;
		const age = d?.age != null ? (d.age < 90 ? '刚刚' : `${Math.round(d.age / 60)} 分钟前`) : '';
		p.innerHTML = `<h4>AI 配额<span>${age ? age + '更新 · ' : ''}← 返回</span></h4>`
			+ (d?.accounts ? rows(d.accounts) : '<div class="qr">正在从 NAS 读取…</div>');
	}
	function load() {
		clearTimeout(timer);
		fetch(API + '/quota', { cache: 'no-store' }).then((r) => {
			if (r.status == 404) { gone = true; close(); return null; }
			return r.ok ? r.json() : null;
		}).then((d) => {
			if (gone || !open) return;
			// (the next refresh is set first: odd data must not stop it for good)
			timer = setTimeout(load, !d || d.loading ? 3000 : 60000);
			if (d) try { render(d); } catch (e) { console.log('aiquota: ' + e); }
		}, () => { if (open) timer = setTimeout(load, 5000); });
	}
	function show() {
		const p = ensure();
		if (!p) return;
		open = true;
		p.hidden = false;
		p.scrollTop = 0;
		if (!p.innerHTML) render(null);
		load();
	}
	function close() {
		open = false;
		clearTimeout(timer);
		if (panel) panel.hidden = true;
	}
	window.addEventListener('keydown', (e) => {
		if (gone || !lockShown()) return;
		const k = e.key;
		if (k == 'ArrowRight' && !open) show();
		else if (k == 'ArrowLeft' && open) close();
		else if ((k == 'ArrowUp' || k == 'ArrowDown') && open) panel.scrollBy({ top: k == 'ArrowUp' ? -110 : 110 });
		else return;
		e.preventDefault();
		e.stopImmediatePropagation();
	}, true);
	// (each wake starts on the clock)
	setInterval(() => { if (open && !lockShown()) close(); }, 700);
})();
/* END e5-aiquota */</script>
