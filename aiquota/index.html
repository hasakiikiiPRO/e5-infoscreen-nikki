<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>配额</title>
<style>
	:root { color-scheme: dark; }
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; color: #e8ecf2;
		font: 14px/1.45 "Noto Sans CJK SC", "DejaVu Sans", sans-serif; cursor: none; user-select: none; }
	body { display: flex; flex-direction: column; padding: 8px 12px; }
	h4 { margin: 0 0 8px; font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; flex-shrink: 0; }
	h4 span { font-size: 11px; color: #8997a8; font-weight: 400; }
	#list { flex: 1; overflow-y: auto; scrollbar-width: none; }
</style>
</head>
<body>
<h4>AI 配额<span id="age"></span></h4>
<div id="list"><div class="qr">正在读取…</div></div>
<script src="/sdk/e5.js"></script>
<script>
'use strict';
	// the panel's accounts in full: a summary, then by kind, each account its own card,
	// each window its own bar with the exact reset time
	const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
	const p2 = (n) => String(n).padStart(2, '0');
	const clockAt = (ms) => { const d = new Date(ms); return `${d.getMonth() + 1}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
	const hm = (ms) => { const d = new Date(ms); return `${p2(d.getHours())}:${p2(d.getMinutes())}`; };
	function left(ms) {
		let s = Math.max(0, Math.floor((ms - Date.now()) / 1000));
		const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
		return d ? `${d}天${h}时` : h ? `${h}时${m}分` : `${m}分`;
	}
	function bar(p, status) {
		const c = status == 'rate-limited' || p >= 90 ? '#ff6b6b' : p >= 60 || status == 'warn' ? '#f0b44c' : '#42d391';
		return `<i class="qb"><i style="width:${Math.min(100, Math.max(0, p))}%;background:${c}"></i></i>`;
	}
	const WST = { ok: '', warn: '注意', 'rate-limited': '已用尽' };
	function line(w) {
		const p = w.percent;
		const st = WST[w.status] ?? '';
		let reset = '';
		if (w.resets_at_ms) reset = w.resets_at_ms > Date.now()
			? `${esc(w.reset_label || '重置')} ${clockAt(w.resets_at_ms)}（${left(w.resets_at_ms)}后）`
			: `${esc(w.reset_label || '重置')} ${clockAt(w.resets_at_ms)} · 已过，数据旧了`;
		return `<div class="qw"><div class="ql"><span>${esc(w.label)}${w.tag ? ` <em>${esc(w.tag)}</em>` : ''}${st ? ` <u>${st}</u>` : ''}</span>`
			+ `${p != null ? `<b>${Math.round(p * 10) / 10}%</b>` : ''}</div>`
			+ (p != null ? bar(p, w.status) : '') + (reset ? `<div class="qr">${reset}</div>` : '') + '</div>';
	}
	const STATE = { ok: ['正常', 'ok'], limited: ['用尽', 'bad'], error: ['异常', 'bad'] };
	const VIA = { live: '实时', snapshot: 'CPA 快照', plugin: 'CPA 插件' };
	const KINDS = [['codex', 'Codex（ChatGPT）'], ['claude', 'Claude'], ['grok', 'Grok'], ['antigravity', 'Antigravity'],
		['deepseek', 'DeepSeek'], ['workbuddy', 'WorkBuddy']];
	function acct(a) {
		const st = STATE[a.state] ?? ['?', 'bad'];
		const ws = Object.values(a.windows ?? {}).filter((w) => w && typeof w == 'object');
		const tag = ws.map((w) => w.tag).find((t) => t && !/^\d/.test(t)) || '';
		const meta = [a.label, VIA[a.via] || a.via, a.generated_at_ms ? hm(a.generated_at_ms) + ' 更新' : ''].filter(Boolean).map(esc).join(' · ');
		return `<div class="qa"><div class="qn"><b>${esc(a.name)}${tag ? ` <em>${esc(tag)}</em>` : ''}</b><span class="${st[1]}">${st[0]}</span></div>`
			+ (meta ? `<div class="qm">${meta}</div>` : '')
			+ ws.map(line).join('')
			+ (a.detail ? `<div class="qe">${esc(a.detail)}</div>` : !ws.length ? '<div class="qe">没有配额数据</div>' : '') + '</div>';
	}
	function count(list) {
		const c = { ok: 0, limited: 0, error: 0 };
		for (const a of list) c[a.state in c ? a.state : 'error']++;
		return c;
	}
	function rows(accounts) {
		if (!accounts.length) return '<div class="qr">没有账号</div>';
		const c = count(accounts);
		const ds = accounts.find((a) => a.source == 'deepseek');
		const bal = ds && Object.values(ds.windows ?? {})[0]?.label;
		let html = `<div class="qs"><span>共 ${accounts.length} 个</span><span class="ok">正常 ${c.ok}</span>`
			+ `<span class="bad">用尽 ${c.limited}</span><span class="bad">异常 ${c.error}</span>${bal ? `<span>${esc(bal)}</span>` : ''}</div>`;
		const known = new Set(KINDS.map((k) => k[0]));
		const groups = KINDS.map(([k, name]) => [name, accounts.filter((a) => a.source == k)]);
		const other = accounts.filter((a) => !known.has(a.source));
		if (other.length) groups.push(['其他', other]);
		for (const [name, list] of groups) {
			if (!list.length) continue;
			const g = count(list);
			html += `<div class="qg">${esc(name)}<span>${list.length} 个 · 正常 ${g.ok}${g.limited ? ` · 用尽 ${g.limited}` : ''}${g.error ? ` · 异常 ${g.error}` : ''}</span></div>`
				+ list.map(acct).join('');
		}
		return html;
	}
	const QCSS = '.qs{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:#c6d0dc;background:rgba(255,255,255,.06);border-radius:10px;padding:7px 10px;margin-bottom:8px}' +
		'.qs .ok{color:#42d391}.qs .bad{color:#ff8a8a}' +
		'.qg{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:#8fb6ff;margin:10px 2px 5px}.qg span{font-size:11px;color:#8997a8;font-weight:400}' +
		'.qa{background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;margin-bottom:6px}' +
		'.qn{display:flex;justify-content:space-between;gap:8px;font-size:13px}.qn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}' +
		'.qn em,.ql em{font-style:normal;font-size:10px;color:#0b0e13;background:#8fb6ff;border-radius:4px;padding:0 4px;margin-left:3px}' +
		'.qn .ok{color:#42d391;font-size:11px;flex-shrink:0}.qn .bad{color:#ff8a8a;font-size:11px;flex-shrink:0}' +
		'.qm{font-size:11px;color:#8997a8;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}' +
		'.qw{margin-top:5px}.ql{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:#c6d0dc}.ql b{font-weight:600;color:#e8ecf2}' +
		'.ql u{text-decoration:none;color:#f0b44c;font-size:11px}' +
		'.qb{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:3px;overflow:hidden}.qb i{display:block;height:100%;border-radius:3px}' +
		'.qr{font-size:11px;color:#8997a8;margin-top:2px}.qe{font-size:11px;color:#ffb0b0;margin-top:4px}';

const style = document.createElement('style');
style.textContent = QCSS;
document.head.appendChild(style);
async function load() {
	let d = null;
	try { d = await e5.api('/quota'); } catch (e) { document.getElementById('list').innerHTML = `<div class="qr">${esc(e.message || e)}</div>`; }
	setTimeout(load, !d || d.loading ? 3000 : 60000);
	if (d) try {
		document.getElementById('age').textContent = d.age != null ? (d.age < 90 ? '刚刚更新' : `${Math.round(d.age / 60)} 分钟前更新`) : '';
		document.getElementById('list').innerHTML = d.accounts ? rows(d.accounts) : '<div class="qr">正在从 NAS 读取…</div>';
	} catch (e) { console.log('aiquota: ' + e); }
}
e5.onKey((k) => {
	if (k.kind == 'up' || k.kind == 'down') { document.getElementById('list').scrollBy({ top: k.kind == 'up' ? -110 : 110 }); return true; }
	return false;
});
load();
</script>
</body>
</html>
